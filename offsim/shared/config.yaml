# Override 2D prototype contract.
# Provisional VEX AI profile using the VEX U Override field/setup as a proxy.
game: override
profile:
  robots: 4
  robots_per_alliance: 2
  match_duration: 120.0
  opening_duration: 30.0
  drivers: false
  dt: 0.05
  decision_interval: 2.0
field:
  width: 144.0
  height: 144.0
  # Coarse 2D proxy boundaries expressed as x+y sums around the shared tape/Midfield band.
  autonomous_lines: [120.0, 168.0]
  # Load Zones are rectangles, not corner squares: depth from the alliance wall
  # sits on the half-tile midpoint (~12"); span along the N/S wall is longer (~26").
  load_zone_depth: 12.0
  load_zone_span: 26.0
robot:
  radius: 7.5
  max_forward_speed: 30.0
  max_lateral_speed: 26.0
  max_yaw_rate: 3.141592653589793
  linear_accel: 48.0
  linear_decel: 64.0
  yaw_accel: 7.0
  interaction_range: 10.0
objects:
  # VEX U: 33 field Pins total including the center-Goal Pin, plus 36 field Cups.
  loose_pins: 32
  loose_cups: 36
  match_load_pins_per_alliance: 13
  match_load_yellow_pins_per_alliance: 3
  match_load_cups_per_alliance: 10
  goal_capacity: 8
scoring:
  alliance_half: 5
  owned_yellow_half: 10
  midfield_robot: 8
  opening_bonus: 12
actions:
  0: IDLE
  1: COLLECT_PIN
  2: COLLECT_CUP
  3: SCORE_NEAREST_GOAL
  4: SCORE_ALLIANCE_GOAL
  5: SCORE_MIDFIELD_GOAL
  6: USE_LOADER
  7: CLAIM_TOGGLE
  8: DEFEND_MIDFIELD
  9: REMOVE_OWN_PIN
num_actions: 10
state:
  per_robot_dim: 80
