# Shared contract between training repo and ROS 2 deployment repo.
# Both repos must agree on action IDs and state vector shape.

actions:
  0: COLLECT_NEAREST_BALL
  1: SCORE_LONG_GOAL
  2: SCORE_MID_GOAL
  3: DESCORE_OPPONENT_LONG
  4: DESCORE_OPPONENT_MID
  5: DEFEND_ZONE
  6: MOVE_TO_REGION_A
  7: MOVE_TO_REGION_B
  8: IDLE

num_actions: 9

# VEX AI field — 12ft x 12ft = 144in x 144in
field:
  width: 144.00    # inches
  height: 144.00   # inches

game:
  match_duration: 120    # seconds
  dt: 0.05               # seconds per sim tick (fine-grained for movement animation)
  decision_interval: 3.0 # seconds between RL re-queries (60 decisions per match)
  max_carry: 3

state:
  max_game_objects: 24
  object_features: 3     # x, y, status
  heatmap_grid_w: 12
  heatmap_grid_h: 12

robot:
  width: 15.00       # inches (top-down square footprint)
  height: 15.00      # inches
  max_speed: 30.00   # inches per second (realistic VEX competition speed)
  turn_rate: 3.14    # radians per second (~180 deg/s)
  collect_range: 8.00   # inches — how close to pick up a ring
  score_range: 10.00    # inches — how close to a goal to score
